    .back{border:0;background:transparent;color:var(--blue);font-weight:700;padding:0;margin:0 0 18px}.detailhead{background:var(--blush);padding:30px 36px;margin-bottom:26px}.detailhead h1{font-size:42px;margin:0 0 7px;letter-spacing:-.025em}.detailhead p{margin:0;font-size:17px;line-height:1.45;max-width:750px}.detailhead .meta{margin-top:15px}.detailactions{display:flex;gap:10px;margin-top:20px}.detailgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(255px,1fr);gap:40px}.detailgrid h2{font-size:26px;margin:0 0 16px}.detailblock{padding:0 0 24px;border-bottom:1px solid var(--line)}.detailblock+.detailblock{padding-top:25px}.detailblock h3{font-size:23px;margin:0 0 13px;line-height:1.25}.detailblock p{font-size:17px;line-height:1.56;margin:0 0 15px;max-width:70ch}.detailblock p:last-child{margin-bottom:0}.detailblock .rowlabel{margin-bottom:10px}.source-line{font-size:14px!important;color:var(--muted)}.prompt{background:var(--frostwash);padding:24px}.prompt h2{font-size:20px;margin:0 0 12px}.prompt p{font-size:16px;line-height:1.5;margin:0 0 22px}.prompt .rowlabel{margin-bottom:9px}.prompt hr{border:0;border-top:1px solid #b8d9da;margin:20px 0}.prompt small{color:var(--muted);line-height:1.45;display:block}

    @media(max-width:980px){.customerrow{grid-template-columns:minmax(180px,.8fr) minmax(0,1.7fr) auto;gap:16px}.updategrid{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.aside h2,.aside p{grid-column:1/-1}.detailgrid{grid-template-columns:1fr}.prompt{max-width:700px}}

    @media(max-width:540px){.reviewbar{padding:10px 12px}.switch{width:100%}.switch button{flex:1;padding:8px 5px;font-size:13px}.sitehead{padding:8px 16px}.brand{font-size:17px}.headnote{display:none}.pagehead h1{font-size:31px}.pagehead p{font-size:16px}.sectionhead{align-items:start}.sectionhead h2{font-size:25px}.customeridentity strong{font-size:19px}.customerrow h3{font-size:18px}.update h3{font-size:21px}.aside{display:block}.detailactions{flex-wrap:wrap}.detailblock p{font-size:16px}.note{display:block}.note strong{display:block;margin-bottom:7px}.comparison-row,.recentrow{grid-template-columns:1fr;gap:5px}}

<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="reviewbar"><div><strong>Customer intelligence · review draft</strong> <span>Compare the two opening views. Both lead to the same customer briefs.</span></div><div class="switch" role="group" aria-label="Choose entry route"><button type="button" id="customerRoute" aria-pressed="true">Customer first</button><button type="button" id="updateRoute" aria-pressed="false">Updates first</button></div></div>
  <div class="sitehead"><div class="brand"><span class="brandmark" aria-hidden="true"></span>Market Overview</div><span class="headnote">Review draft · 24 Sep 2026</span></div>
  <div class="shell"><nav class="sidebar" aria-label="Site views"><span class="navgroup">Explore</span><span class="navitem dim">At a glance</span><span class="navitem dim">Who runs what</span><span class="navitem dim">Product matrix</span><span class="navitem dim">Timeline</span><span class="navdivider"></span><span class="navgroup">Customer view</span><span class="navitem active" aria-current="page">Customer intelligence</span></nav><main id="main" tabindex="-1"><div class="content" id="content"></div></main></div>
  <script>
    const accounts={
      natwest:{name:'NatWest UK',short:'NW',sector:'Financial services',date:'1 Oct 2026',headline:'Platinum moves to family mobile cover',fact:'NatWest says Reward Platinum mobile insurance will cover family phones from 1 October as part of a wider packaged-account refresh.',relevance:'The change affects a benefit Likewize administers. The public notice does not establish the operational changes needed for registration, claims or customer communications.',question:'What changes operationally when Platinum moves to family cover?',source:'https://www.natwest.com/current-accounts/existing-customers/reward-platinum.html',sourceName:'NatWest Reward Platinum page',status:'Primary source',context:'Announced change · future effective date',checked:'NatWest page checked 24 Sep 2026'},
      ee:{name:'EE UK',short:'EE',sector:'Telecoms',date:'11 Aug 2026',headline:'Early Phone Swap brings return and settlement into one journey',fact:'EE widened its existing early-upgrade route to nearly one million Flex Pay customers. Its terms name Likewize as the returned-phone purchase-programme operator.',relevance:'The return condition, assessment and old-plan settlement now form a concrete journey to compare with Vodafone Xchange. The published terms do not establish customer friction.',question:'Where, if anywhere, would clearer condition checks or settlement updates help customers and EE Guides?',source:'https://ee.co.uk/content/dam/help/terms-and-conditions/mobile/early-phone-swap/Early%20Phone%20Swap%20and%20Trade%20In%20TCs%20-%2011%20August%202026.pdf',sourceName:'EE Early Phone Swap terms',status:'Primary source',context:'Product change · UK',checked:'EE terms checked 24 Sep 2026'}
    };
    const content=document.getElementById('content');let route='customers',selected=null;
    const icon='<span class="arrow" aria-hidden="true">→</span>';
    function setRoute(next){route=next;selected=null;history.replaceState(null,'','#'+next);render()}
    function openAccount(id){selected=id;history.replaceState(null,'','#'+route+'/'+id);render();document.getElementById('main').focus();window.scrollTo(0,0)}
    function status(a){return a.status==='Primary source'?'':`<span class="status">${a.status}</span>`}
    function renderCustomerFirst(){content.innerHTML=`<header class="pagehead"><h1>Customer intelligence</h1><p>Choose a customer to see the developments and market examples worth bringing to a conversation.</p><div class="meta"><strong>Selected pilot snapshot</strong> · EE and NatWest checked 24 Sep 2026</div></header><div class="sectionhead"><div><h2>Choose a customer</h2><p>Each brief leads with its strongest conversation point, then shows dated changes and sources.</p></div></div><div class="customerlist">${Object.entries(accounts).map(([id,a])=>`<a class="customerrow" href="#customers/${id}" data-open="${id}" aria-label="Open ${a.name} brief"><div class="customeridentity"><span class="mark" aria-hidden="true">${a.short}</span><div><strong>${a.name}</strong><small>${a.sector}</small></div></div><div><span class="rowlabel">Development to discuss · ${a.date}</span><h3>${a.headline}</h3><p>${a.relevance}</p></div><span class="rowaction">Open brief ${icon}</span></a>`).join('')}</div><div class="note"><strong>What this route does</strong><p>Readers start with the account they know. A single relevant signal helps them choose; the full interpretation and sources appear inside the brief.</p></div>${footer()}`}
    function renderUpdatesFirst(){content.innerHTML=`<header class="pagehead"><h1>Customer intelligence</h1><p>Selected changes that may inform a customer conversation, with the reason each one deserves attention.</p><div class="meta"><strong>Selected pilot snapshot</strong> · EE and NatWest checked 24 Sep 2026</div></header><div class="updategrid"><div><div class="sectionhead"><div><h2>Worth discussing</h2><p>Across the two pilot customers. Most recent or upcoming change first.</p></div></div><div class="updates">${['natwest','ee'].map(id=>{const a=accounts[id];return `<article class="update"><div class="update-top"><span class="date">${a.date}</span><span class="accounttag">${a.name}</span>${status(a)}</div><h3>${a.headline}</h3><p>${a.fact}</p><p class="interpretation"><strong>Why it may matter.</strong> ${a.relevance}</p><button class="textbutton" type="button" data-open="${id}">Open ${a.name} brief ${icon}</button></article>`}).join('')}</div></div><aside class="aside"><h2>Go to a customer</h2><p>Open a focused brief when you already know which account you are preparing for.</p><button type="button" data-open="natwest">NatWest UK ${icon}</button><button type="button" data-open="ee">EE UK ${icon}</button></aside></div><div class="note"><strong>What this route does</strong><p>Readers see the selected changes first and can move into an account brief when a development is relevant. This view needs enough strong items to justify regular return visits.</p></div>${footer()}`}
    function renderEEDetail(){
      const a=accounts.ee;
      content.innerHTML=`
        <button class="back" type="button" id="backButton">← Back to ${route==='customers'?'customers':'updates'}</button>
        <header class="detailhead">
          <h1>EE UK</h1>
          <p>A customer conversation about the returned-phone journey behind Early Phone Swap.</p>
          <div class="meta"><strong>Selected pilot snapshot</strong> · EE terms checked 24 Sep 2026</div>
          <div class="detailactions"><button class="button" type="button" id="copyBrief">Copy conversation brief</button><button class="button secondary" type="button" id="sourceButton">Open EE terms</button></div>
        </header>
        <div class="detailgrid"><div>
          <section class="detailblock">
            <h2>Discuss the return and settlement journey behind Early Phone Swap</h2>
            <p>EE widened an existing upgrade route on 11 August. Its terms name Likewize as the returned-phone purchase-programme operator. Likewize sends the return pack and assesses the phone; EE processes settlement of the old device agreement within 10 working days of acceptance. The customer may briefly pay two device agreements.</p>
            <p class="evidence-line"><strong>Editorial interpretation.</strong> The return and settlement steps give the account holder a concrete journey to discuss. The public sources do not establish customer friction or show that another journey performs better.</p>
          </section>
          <section class="detailblock">
            <h2>How a peer handles the return</h2>
            <div class="comparison">
              <div class="comparison-row"><div><strong>EE Early Phone Swap</strong><small>Widened 11 Aug 2026</small></div><div>EE app shows eligibility; Guides handle the upgrade by phone or in store. Likewize sends the return pack and assesses the phone. The old agreement is settled after acceptance. <a href="${a.source}" target="_blank" rel="noopener noreferrer">EE terms</a> · <a href="https://ee.co.uk/help/mobile/upgrade/early-phone-swap" target="_blank" rel="noopener noreferrer">EE help</a></div></div>
              <div class="comparison-row"><div><strong>Vodafone Xchange</strong><small>Current UK journey</small></div><div>The app Trade-in Tool checks condition before checkout. Customers return the phone within 14 days by post or in store; Vodafone checks it again before settling the old Phone Plan. <a href="https://www.vodafone.co.uk/mobile/xchange" target="_blank" rel="noopener noreferrer">Vodafone journey</a></div></div>
            </div>
            <p class="comparison-note">Journey comparison only. Eligibility, finance and condition rules differ.</p>
          </section>
          <section class="detailblock">
            <h2>Account change</h2>
            <div class="recentrow"><time datetime="2026-08-11">11 Aug 2026</time><div><h3>Early Phone Swap reaches more Flex Pay customers</h3><p>EE said the widened route was immediately available to nearly one million customers. The upgrade still requires an eligible agreement, a working returned phone and a new device agreement.</p><a href="https://newsroom.ee.co.uk/ee-launches-early-phone-swap-bringing-the-new-phone-feeling-sooner-with-the-latest-and-greatest-handsets-at-no-extra-cost/" target="_blank" rel="noopener noreferrer">EE announcement</a></div></div>
          </section>
        </div><aside class="prompt">
          <h2>Question to take in</h2>
          <p>${a.question}</p>
          <hr><span class="rowlabel">Evidence boundary</span>
          <p class="evidence-line">EE's published terms confirm Likewize's purchase-programme role. They do not describe all operating responsibilities or report customer outcomes.</p>
          <small>This is a selected pilot snapshot, not complete live monitoring. Contact and account-plan information belongs in the approved account workflow.</small>
        </aside></div>
        <div class="feedback"><strong>Drafting question:</strong> Would Ashleigh take this journey comparison into an EE conversation?</div>${footer()}`;
      document.getElementById('backButton').onclick=()=>setRoute(route);
      document.getElementById('sourceButton').onclick=()=>window.open(a.source,'_blank','noopener');
      document.getElementById('copyBrief').onclick=async(e)=>{const brief=`EE UK | Customer conversation\nDiscuss the return and settlement journey behind Early Phone Swap.\nEE's terms name Likewize as the returned-phone purchase-programme operator. Likewize sends the return pack and assesses the phone; EE settles the old device agreement after acceptance. Vodafone Xchange checks condition in its app before checkout and again after return. This comparison does not establish customer friction.\nQuestion: ${a.question}\nSources: ${a.source} | https://www.vodafone.co.uk/mobile/xchange`;try{await navigator.clipboard.writeText(brief);e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy conversation brief',2000)}catch{e.target.textContent='Copy unavailable';setTimeout(()=>e.target.textContent='Copy conversation brief',2500)}};
    }
    function renderNatWestDetail(){
      const a=accounts.natwest;
      content.innerHTML=`
        <button class="back" type="button" id="backButton">← Back to ${route==='customers'?'customers':'updates'}</button>
        <header class="detailhead">
          <h1>NatWest UK</h1>
          <p>A customer conversation built around the strongest selected market angle.</p>
          <div class="meta"><strong>Selected pilot snapshot</strong> · NatWest page checked 24 Sep 2026 · October change upcoming</div>
          <div class="detailactions"><button class="button" type="button" id="copyBrief">Copy conversation brief</button><button class="button secondary" type="button" id="sourceButton">Open NatWest source</button></div>
        </header>
        <div class="detailgrid"><div>
          <section class="detailblock">
            <h2>Discuss how Platinum households will find and use family phone cover</h2>
            <p>NatWest says family cover will join Reward Platinum on 1 October. Nationwide includes family mobile cover in FlexPlus; Monzo offers it through Max with Family. Those different packaging choices give the account holder a concrete way to discuss how the NatWest benefit will be presented and used.</p>
            <p class="evidence-line"><strong>Editorial interpretation.</strong> The comparison raises a customer-journey question. It does not establish a problem with NatWest's communications or show which package performs better.</p>
          </section>
          <section class="detailblock">
            <h2>How peers package family cover</h2>
            <div class="comparison">
              <div class="comparison-row"><div><strong>NatWest Platinum</strong><small>Announced for 1 Oct</small></div><div>Family phone cover included in the refreshed account. <a href="${a.source}" target="_blank" rel="noopener noreferrer">Product page</a></div></div>
              <div class="comparison-row"><div><strong>Nationwide FlexPlus</strong><small>Current package</small></div><div>Family mobile cover included with the account. <a href="https://www.nationwide.co.uk/current-accounts/flexplus/mobile-phone" target="_blank" rel="noopener noreferrer">Product page</a></div></div>
              <div class="comparison-row"><div><strong>Monzo Max with Family</strong><small>Current family tier</small></div><div>Family extension offered through a separate tier. <a href="https://monzo.com/current-account/max" target="_blank" rel="noopener noreferrer">Product page</a></div></div>
            </div>
            <p class="comparison-note">Packaging comparison only. Eligibility, limits and other account benefits differ.</p>
          </section>
          <section class="detailblock">
            <h2>Recent account changes</h2>
            <div class="recentrow"><time datetime="2026-10-01">1 Oct 2026<br>Upcoming</time><div><h3>Platinum family cover arrives within a wider benefit refresh</h3><p>Mobile protection is one part of a new mix of travel, health and lifestyle benefits. The operating impact is not established publicly.</p><a href="${a.source}" target="_blank" rel="noopener noreferrer">NatWest Reward Platinum page</a></div></div>
            <div class="recentrow"><time datetime="2026-09-11">11 Sep 2026</time><div><h3>NatWest appoints a Retail Customer Experience &amp; Engagement MD</h3><p>Harsh Agarwal's remit covers propositions, segment strategy and digital experience. Whether his function owns the packaged-account relationship is unknown.</p><a href="https://www.natwestgroup.com/news-and-insights/news-room/press-releases/2026/natwest-group-appoints-harsh-agarwal-as-managing-director-custom.html" target="_blank" rel="noopener noreferrer">NatWest Group announcement</a></div></div>
          </section>
        </div><aside class="prompt">
          <h2>Question to take in</h2>
          <p>How will a Platinum customer discover which family phones are covered, and how will a family member get help?</p>
          <hr><span class="rowlabel">Evidence boundary</span>
          <p class="evidence-line">NatWest's public page states the 1 October change. The benefit remains future effective; the operating impact is not established publicly.</p>
          <small>This is a selected pilot snapshot, not complete live monitoring. Contact and account-plan information belongs in the approved account workflow.</small>
        </aside></div>
        <div class="feedback"><strong>Drafting question:</strong> Is this the right level of analysis for an account holder, or does the lead need a sharper customer problem?</div>${footer()}`;
      document.getElementById('backButton').onclick=()=>setRoute(route);
      document.getElementById('sourceButton').onclick=()=>window.open(a.source,'_blank','noopener');
      document.getElementById('copyBrief').onclick=async(e)=>{const brief=`NatWest UK | Customer conversation\nDiscuss how Platinum households will find and use family phone cover.\nNatWest says family cover joins Platinum on 1 October. Nationwide includes family mobile cover in FlexPlus; Monzo offers Max with Family. This is a packaging comparison, not a comparison of policy value.\nQuestion: How will a Platinum customer discover which family phones are covered, and how will a family member get help?\nSource: ${a.source}\nNatWest page checked 24 Sep 2026.`;try{await navigator.clipboard.writeText(brief);e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy conversation brief',2000)}catch{e.target.textContent='Copy unavailable';setTimeout(()=>e.target.textContent='Copy conversation brief',2500)}};
    }
    function footer(){return '<div class="sitefoot">Likewize · Customer intelligence concept review · Not a live monitoring service</div>'}
    function render(){document.getElementById('customerRoute').setAttribute('aria-pressed',String(route==='customers'));document.getElementById('updateRoute').setAttribute('aria-pressed',String(route==='updates'));if(selected==='natwest')renderNatWestDetail();else if(selected==='ee')renderEEDetail();else if(route==='customers')renderCustomerFirst();else renderUpdatesFirst();content.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',(event)=>{event.preventDefault();openAccount(b.dataset.open)}))}
    document.getElementById('customerRoute').onclick=()=>setRoute('customers');document.getElementById('updateRoute').onclick=()=>setRoute('updates');const bits=location.hash.slice(1).split('/');if(bits[0]==='updates')route='updates';if(accounts[bits[1]])selected=bits[1];render();
  </script>
</body>
</html>
