<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Likewize Decks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#23202B;
    --surface:#2C2836;
    --frame:#35303F;
    --ink:#DCD6E4;
    --grey:#A9A2B8;
    --pink:#FF96FF;
    --hair:rgba(255,150,255,0.15);
    --track:rgba(255,255,255,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:Manrope, Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  a{ color:inherit; text-decoration:none; }

  .hero{ position:relative; overflow:hidden; padding:60px 32px 74px; }
  .hero::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(680px 300px at 12% -30%, rgba(255,150,255,0.22), transparent 70%),
      radial-gradient(560px 320px at 88% 120%, rgba(50,0,190,0.40), transparent 70%);
  }
  .hero .wrap{ max-width:1040px; margin:0 auto; position:relative; }
  .hero .eyebrow{
    display:flex; align-items:center; gap:10px;
    color:var(--pink); font-size:11px; text-transform:uppercase;
    letter-spacing:.16em; font-weight:800; margin-bottom:14px;
  }
  .hero .eyebrow::after{ content:""; height:1px; flex:1; background:linear-gradient(90deg,var(--hair),transparent); }
  .hero h1{
    margin:0; font-family:"Bricolage Grotesque", Arial, sans-serif; font-weight:800;
    font-size:clamp(34px,5vw,56px); line-height:1.02; letter-spacing:-.03em; text-wrap:balance;
  }
  .hero .count{ margin:16px 0 0; font-size:13px; color:var(--grey); }

  .content{ max-width:1040px; margin:-38px auto 0; padding:0 32px 100px; position:relative; }
  .filters{
    position:sticky; top:10px; z-index:5;
    display:flex; gap:8px; flex-wrap:wrap;
    background:rgba(44,40,54,0.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--hair); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.30);
    padding:14px; margin-bottom:32px;
  }
  .filters button{
    font-family:inherit; cursor:pointer; appearance:none;
    font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    padding:8px 13px; border-radius:5px; border:1px solid var(--hair);
    background:transparent; color:var(--ink);
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .filters button:hover{ background:var(--frame); border-color:var(--pink); }
  .filters button.on,
  .filters button.on:hover{ background:var(--pink); border-color:var(--pink); color:var(--bg); }
  .filters button:focus-visible,
  .card-link:focus-visible,
  .variant a:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; border-radius:3px; }

  .category{ margin-bottom:40px; }
  .cat-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .cat-head .swatch{ width:16px; height:4px; border-radius:2px; }
  .cat-head h2{
    font-size:12px; margin:0; text-transform:uppercase; letter-spacing:.09em;
    font-weight:800; color:var(--grey);
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }

  .card{
    border-radius:8px; background:var(--frame); padding:3px;
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,0.38); }
  .card-inner{
    background:var(--surface); border-radius:6px; padding:16px 16px 14px;
    border-top:3px solid var(--accent,var(--pink));
    display:flex; flex-direction:column; gap:8px; height:100%;
  }
  .card-link{ display:flex; flex-direction:column; gap:8px; flex:1; }
  .card h3{
    margin:0; font-family:"Bricolage Grotesque", Arial, sans-serif; font-weight:600;
    font-size:15px; line-height:1.35; letter-spacing:-.01em;
  }
  .card .desc{ margin:0; font-size:12.5px; line-height:1.5; color:var(--grey); }
  .card .meta{ margin-top:6px; display:flex; flex-direction:column; gap:6px; }
  .card .progress-row{ display:flex; align-items:center; gap:8px; }
  .card .progress-track{ flex:1; height:4px; border-radius:2px; background:var(--track); overflow:hidden; }
  .card .progress-fill{ height:100%; border-radius:2px; background:var(--accent,var(--pink)); }
  .card .progress-pct{
    font-size:11px; font-weight:800; color:var(--accent,var(--pink));
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .card .updated{
    font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
  }
  .card .go{ margin-top:auto; padding-top:8px; font-size:12px; font-weight:800; color:var(--accent,var(--pink)); }
  .card .variant{ font-size:11.5px; color:var(--grey); border-top:1px dashed var(--hair); padding-top:7px; }
  .card .variant a{ color:var(--accent,var(--pink)); font-weight:600; }

  @media (prefers-reduced-motion:reduce){
    .card, .filters button{ transition:none; }
    .card:hover{ transform:none; }
  }

  footer{
    text-transform:uppercase; letter-spacing:.12em; font-size:11px;
    color:var(--grey); text-align:center; padding-top:8px;
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">Likewize</div>
      <h1>Decks &amp; interactive docs</h1>
      <p class="count" id="count"></p>
    </div>
  </header>
  <main class="content" id="content"></main>

<script>
/*
  New deck? Add an entry to the matching category's `items` array below
  (or a new category object if none fits) with: title, href, desc,
  pct (0-100 completion), updated (YYYY-MM-DD). See publish-deck skill.
  Category `color` must stay legible on the dark canvas, it is used for
  the swatch, the card border, the progress fill AND small accent text.
*/
const DATA = [
  { key:"propositions", name:"Propositions", color:"#FFD166", items:[
    { title:"Market Overview", href:"https://market-overview.mdxc6.workers.dev",
      desc:"Internal market reference. Likewize sign-in required.",
      cta:"Open site", pct:75, updated:"2026-08-06" },
  ]},
  { key:"process", name:"Process", color:"#A78BFF", items:[
    { title:"Notes That Work Back: Obsidian + Claude Code", href:"obsidian-claude-workflow/",
      desc:"How the Obsidian + Claude Code note-taking workflow fits together.",
      pct:100, updated:"2026-07-17" },
    { title:"Initiative Deck Template", href:"initiative-deck-template/",
      desc:"Blank 16-slide template for product-initiative stakeholder decks, covering the ask through to roadmap.",
      pct:100, updated:"2026-07-23" },
  ]},
  { key:"esim", name:"eSIM", color:"#5EE6E0", items:[
    { title:"eSIM: Route to Market", href:"esim-initiative-deck/",
      desc:"Internal stakeholder deck covering the eSIM proposition.",
      pct:90, updated:"2026-08-27" },
    { title:"eSIM Product Spec", href:"esim-client-briefing/",
      desc:"Client briefing on the eSIM product and commercial spec for both the funded-entitlement and full models.",
      pct:90, updated:"2026-07-23" },
  ]},
  { key:"tickets", name:"Tickets", color:"#FF96FF", items:[
    { title:"Tickets: Overview and Update", href:"tickets-overview-and-update/",
      desc:"Internal update on the Tickets proposition, delivery status, roadmap and strategic options.",
      pct:100, updated:"2026-08-19" },
    { title:"Likewize Moments: Partner Proposition", href:"partner-proposition/",
      desc:"Partner-facing pitch for bringing ticket protection to your platform.",
      pct:90, updated:"2026-08-13",
      variants:[{title:"Tickets PDF Export (variant)", href:"tickets-pdf-export/"}] },
    { title:"Likewize Moments: Tickets Partner Portal", href:"tickets-partner-portal/",
      desc:"Partner config document, for taking a client through required intake details.",
      pct:50, updated:"2026-07-07" },
    { title:"ePay Tickets: Recommended Rollout", href:"epay-tickets-rollout/",
      desc:"One-pager for ePay covering brand-level URL tracking and reporting, plus the recommended phased brand rollout.",
      pct:100, updated:"2026-07-20" },
    { title:"Ticket Protection: How It Works", href:"protection-slide/",
      desc:"Single-slide summary of cover type, regulatory, and delivery for ticket protection.",
      pct:100, updated:"2026-07-07" },
    { title:"Ticket Protection: Stakeholder Deck", href:"ticket-protection-deck/",
      desc:"Internal stakeholder deck covering the ticket protection proposition.",
      pct:100, updated:"2026-07-15" },
    { title:"Screen Protection: Stakeholder Deck", href:"screen-protection-deck/",
      desc:"Internal stakeholder deck covering the screen protection proposition.",
      pct:100, updated:"2026-07-10" },
    { title:"Embedded Checkout Mockup", href:"embedded-checkout-mockup/",
      desc:"Mockup of screen protection embedded directly into the checkout process.",
      pct:100, updated:"2026-07-09" },
  ]},
];

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d} ${MONTHS[parseInt(m,10)-1]} ${y}`;
}

function renderCount(){
  const items = DATA.flatMap(c=>c.items);
  const wip = items.filter(i=>i.pct < 100).length;
  document.getElementById('count').textContent =
    `${items.length} docs across ${DATA.length} categories · ${wip} still in progress`;
}

function render(){
  const el = document.getElementById('content');
  let html = `<div class="filters">
    <button class="on" aria-pressed="true" data-filter="all">All</button>
    <button aria-pressed="false" data-filter="incomplete">Incomplete</button>`;
  DATA.forEach(cat=>{ html += `<button aria-pressed="false" data-filter="${cat.key}">${cat.name}</button>`; });
  html += `</div>`;
  DATA.forEach(cat=>{
    html += `<div class="category" data-cat="${cat.key}">
      <div class="cat-head"><span class="swatch" style="background:${cat.color}"></span><h2>${cat.name}</h2></div>
      <div class="grid">`;
    cat.items.forEach(it=>{
      html += `<div class="card" data-done="${it.pct >= 100}" style="--accent:${cat.color}">
        <div class="card-inner">
          <a class="card-link" href="${it.href}" target="_blank" rel="noopener">
            <h3>${it.title}</h3>
            ${it.desc ? `<p class="desc">${it.desc}</p>` : ''}
            <div class="meta">
              <div class="progress-row">
                <div class="progress-track"><div class="progress-fill" style="width:${it.pct}%"></div></div>
                <span class="progress-pct">${it.pct}%</span>
              </div>
              <span class="updated">Updated ${formatDate(it.updated)}</span>
            </div>
            <span class="go">${it.cta || 'Open deck'} →</span>
          </a>
          ${it.variants ? it.variants.map(v=>`<div class="variant">Variant: <a href="${v.href}" target="_blank" rel="noopener">${v.title}</a></div>`).join('') : ''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `<footer>Likewize · internal</footer>`;
  el.innerHTML = html;

  document.querySelectorAll('.filters button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.filters button').forEach(b=>{
        b.classList.toggle('on', b===btn);
        b.setAttribute('aria-pressed', String(b===btn));
      });
      const f = btn.dataset.filter;
      document.querySelectorAll('.category').forEach(c=>{
        // 'incomplete' filters individual cards, so a category can end up empty
        let shown = 0;
        c.querySelectorAll('.card').forEach(card=>{
          const hide = (f==='incomplete' && card.dataset.done==='true');
          card.style.display = hide ? 'none' : '';
          if(!hide) shown++;
        });
        const match = (f==='all' || f==='incomplete' || c.dataset.cat===f);
        c.style.display = (match && shown) ? '' : 'none';
      });
    });
  });
}
renderCount();
render();
</script>
</body>
</html>
